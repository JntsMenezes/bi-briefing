# Supabase free projects pause after ~7 days without activity.
# A read-only ping (get_request_by_token) was NOT enough: the project paused
# on 2026-10-19 even with daily successful pings. Now we do a real write:
# keepalive_ping() updates the single row of public.keepalive
# (see supabase/migrations/20261106_keepalive.sql).
# The publishable key is public by design (it's already in index.html).
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 11 * * *'   # every day at 11:00 UTC (08:00 Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write to the database via public RPC
        run: |
          code=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "apikey: sb_publishable_odelJJwlY0Z6uObcxdb6uA_jAbEHRfX" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://tovjamavkkcfbodmljhp.supabase.co/rest/v1/rpc/keepalive_ping)
          echo "HTTP $code"; cat response.txt; echo
          test "$code" = "200"
