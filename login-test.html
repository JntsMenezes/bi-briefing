<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Login - BI Briefing</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #0f172a;
    color: #e2e8f0;
  }
  .card {
    background: #1e293b;
    padding: 2.5rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
  button {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: #fff;
    color: #1f2937;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  .status {
    margin-top: 1.5rem;
    padding: 1rem;
    border-radius: 8px;
    background: #0f172a;
    font-size: 0.85rem;
    text-align: left;
    word-break: break-all;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { border: 1px solid #22c55e; }
  .status.err { border: 1px solid #ef4444; }
  .status pre { white-space: pre-wrap; margin: 0.5rem 0 0; color: #cbd5e1; }
  .logout {
    margin-top: 1rem;
    background: transparent;
    border: 1px solid #475569;
    color: #94a3b8;
    display: none;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Teste de Login</h1>
  <p>Página isolada só para validar o login com Google via Supabase Auth antes de integrar ao app.</p>
  <button id="google-btn">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
    Entrar com Google
  </button>
  <button id="logout-btn" class="logout">Sair</button>
  <div id="status" class="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://tovjamavkkcfbodmljhp.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_odelJJwlY0Z6uObcxdb6uA_jAbEHRfX';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const statusEl = document.getElementById('status');
  const googleBtn = document.getElementById('google-btn');
  const logoutBtn = document.getElementById('logout-btn');

  function showStatus(ok, title, data) {
    statusEl.className = 'status show ' + (ok ? 'ok' : 'err');
    statusEl.innerHTML = '<strong>' + title + '</strong><pre>' + JSON.stringify(data, null, 2) + '</pre>';
  }

  async function refreshSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      googleBtn.style.display = 'none';
      logoutBtn.style.display = 'inline-flex';
      showStatus(true, 'Logado como:', {
        id: session.user.id,
        email: session.user.email,
        name: session.user.user_metadata?.full_name
      });
    } else {
      googleBtn.style.display = 'inline-flex';
      logoutBtn.style.display = 'none';
    }
  }

  googleBtn.addEventListener('click', async () => {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
    if (error) showStatus(false, 'Erro ao iniciar login:', error);
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    statusEl.className = 'status';
    refreshSession();
  });

  refreshSession();
</script>
</body>
</html>
